[package]
name = "widget"
version = "0.1.0"
edition = "2024"

[lib]
name = "widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "network"] }
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }
tauri-plugin-autostart = "2"
serde_json = "1.0.154"
xcap = "0.9.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSScreen", "NSResponder"] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["image-data", "wayland-data-control"] }
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_5"] }

[target."cfg(windows)".dependencies]
clipboard-win = "5.4.1"
base64 = "0.22"
winreg = "0.56"
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
