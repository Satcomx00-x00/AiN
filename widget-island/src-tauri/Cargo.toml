[package]
name = "widget"
version = "0.1.2"
edition = "2024"

[lib]
name = "widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "specta"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "network"] }
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }
tauri-plugin-autostart = "2"
serde_json = "1.0.154"
xcap = "0.9.8"
cpal = "0.18.2"
ureq = "3.4.2"
base64 = "0.23"
# Speech recognition for dictation, from prebuilt static libraries (Windows, Linux and macOS x64).
sherpa-onnx = "1.13.8"
sha2 = "0.11.1"
tauri-plugin-dialog = "2"
# Typed TypeScript bindings for commands and events; pinned exactly while specta 2 is a release candidate.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSScreen", "NSResponder"] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["image-data", "wayland-data-control"] }
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
# So helper processes (pactl) end with the app, however it ends.
libc = "0.2"
# Now playing, from MPRIS players over D-Bus.
mpris = "2.1"

[target."cfg(windows)".dependencies]
clipboard-win = "5.4.1"
winreg = "0.56"
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
