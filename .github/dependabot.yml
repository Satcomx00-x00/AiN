version: 2
# Groups take minor and patch updates together; a major opens its own PR, so a breaking one fails
# alone instead of blocking the group's fixes (including its security updates).
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before taking a release, so a broken or compromised one can be pulled first
    # (security updates are not delayed).
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: bun
    directories: [/ain, /npm]
    schedule:
      interval: weekly
    # Wait a week before taking a release, so a broken or compromised one can be pulled first
    # (security updates are not delayed).
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    groups:
      frontend:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: cargo
    directory: /ain/src-tauri
    schedule:
      interval: weekly
    # Wait a week before taking a release, so a broken or compromised one can be pulled first
    # (security updates are not delayed).
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    groups:
      rust:
        patterns: ["*"]
        update-types: ["minor", "patch"]
