version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before taking a release, so a broken or compromised one can be pulled first
    # (security updates are not delayed).
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: bun
    directory: /widget-island
    schedule:
      interval: weekly
    # Wait a week before taking a release, so a broken or compromised one can be pulled first
    # (security updates are not delayed).
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    groups:
      frontend:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /widget-island/src-tauri
    schedule:
      interval: weekly
    # Wait a week before taking a release, so a broken or compromised one can be pulled first
    # (security updates are not delayed).
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    groups:
      rust:
        patterns: ["*"]
