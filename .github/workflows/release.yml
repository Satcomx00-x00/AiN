name: Release

# Manual release: CI gate -> version bump + changelog (git-cliff) -> tag -> x64 builds -> publish.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto = derived from Conventional Commits)
        type: choice
        default: auto
        options: [auto, patch, minor, major]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BUN_VERSION: "1.3.14"

jobs:
  ci:
    name: CI
    # Not yet the newer `$/` self-repository syntax: actionlint (1.7.12) predates it.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  prepare:
    name: Prepare release
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      # Keeps the token: this job pushes the release commit and tag.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: git-cliff

      - name: Compute next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          tag="$(git cliff --bumped-version --bump "$BUMP")"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Unexpected version '$tag'"; exit 1; }
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists — no releasable commits since the last release?"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Bump versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd widget-island
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp && mv package.json.tmp package.json
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" src-tauri/Cargo.toml
          awk -v v="$VERSION" 'prev == "name = \"widget\"" && /^version = / { $0 = "version = \"" v "\"" } { print; prev = $0 }' \
            src-tauri/Cargo.lock > Cargo.lock.tmp && mv Cargo.lock.tmp src-tauri/Cargo.lock
          git diff --stat

      - name: Update CHANGELOG.md
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: git cliff --tag "$TAG" --output CHANGELOG.md

      - name: Commit, tag and push
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md widget-island/package.json widget-island/src-tauri/Cargo.toml widget-island/src-tauri/Cargo.lock
          git commit -m "chore(release): $TAG"
          git tag -a "$TAG" -m "$TAG"
          git push --atomic origin HEAD:main "$TAG"

      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git cliff --latest --strip all --output RELEASE_NOTES.md
          gh release create "$TAG" --draft --verify-tag --title "AiN $TAG" --notes-file RELEASE_NOTES.md
          echo "id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id")" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            # The AppImage runs on any distro, immutable ones (Fedora Silverblue) included.
            bundles: deb,rpm,appimage
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS x64
            os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: ./.github/scripts/linux-deps.sh
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: widget-island/src-tauri -> target
          key: release
      # rust-cache keeps sherpa-onnx-sys's build output but prunes the native libraries it extracted
      # under target/, which it then never fetches again: make it start over.
      - name: Refetch sherpa-onnx's native libraries
        shell: bash
        working-directory: widget-island/src-tauri
        run: |
          rm -rf target/sherpa-onnx-prebuilt
          cargo clean --locked -p sherpa-onnx-sys --target ${{ matrix.target }}
      - name: Install frontend dependencies
        working-directory: widget-island
        run: bun install --frozen-lockfile
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: widget-island
          tauriScript: bun run tauri
          args: --target ${{ matrix.target }}${{ matrix.bundles && format(' --bundles {0}', matrix.bundles) || '' }}
          releaseId: ${{ needs.prepare.outputs.release_id }}

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
