name: Release

# Continuous release: every green CI run on `main` -> plan (Conventional Commits since the last tag)
# -> version bump + changelog (git-cliff) -> tag -> x64 builds -> publish.
# Only feat, fix, perf and breaking changes cut a release; docs, ci, chore, refactor… wait for one.
# The button (workflow_dispatch) forces a release, or a given bump (e.g. `major` for 1.0.0).
on:
  # Safe despite zizmor's warning: only push runs on this repository's `main` get through (see
  # `plan`), and nothing from the triggering run (artifacts, untrusted inputs) is used.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto = derived from Conventional Commits)
        type: choice
        default: auto
        options: [auto, patch, minor, major]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BUN_VERSION: "1.3.14"

jobs:
  plan:
    name: Plan release
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      sha: ${{ steps.plan.outputs.sha }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: git-cliff

      - name: Decide whether and what to release
        id: plan
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
          FORCED: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          skip() { echo "release=false" >> "$GITHUB_OUTPUT"; echo "No release: $1" >> "$GITHUB_STEP_SUMMARY"; exit 0; }

          # Pushes that land while CI runs queue up here: only the newest commit is released, and it
          # carries the older ones. (A release from an older commit could not be pushed anyway.)
          [[ "$(git rev-parse origin/main)" == "$sha" ]] || skip "main has moved past ${sha:0:7}; its own run releases it."

          # git-cliff parses the commits exactly as for the changelog (skipping chore(release), deps…).
          releasable="$(git cliff --unreleased --context | jq '[.[].commits[]
            | select(.breaking or (.group | test("Features|Bug fixes|Performance")))] | length')"
          if [[ "$FORCED" != true && "$releasable" == 0 ]]; then
            skip "no feat, fix, perf or breaking change since the last release."
          fi

          tag="$(git cliff --bumped-version --bump "$BUMP")"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Unexpected version '$tag'"; exit 1; }
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null && skip "$tag already exists: nothing new to release."
          {
            echo "release=true"
            echo "tag=$tag"
            echo "version=${tag#v}"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing **$tag** ($releasable releasable commits)" >> "$GITHUB_STEP_SUMMARY"

  # A forced release did not come out of a CI run: run it now, as a gate.
  ci:
    name: CI
    needs: plan
    if: github.event_name == 'workflow_dispatch' && needs.plan.outputs.release == 'true'
    # Not yet the newer `$/` self-repository syntax: actionlint (1.7.12) predates it.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  prepare:
    name: Prepare release
    needs: [plan, ci]
    # `ci` is skipped when this run comes from a green CI run. GitHub skips every job downstream of a
    # skipped one unless it says otherwise: hence the explicit conditions here, on `build` and on `publish`.
    if: >-
      !cancelled() && needs.plan.outputs.release == 'true' &&
      (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      # Keeps the token: this job pushes the release commit and tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5 # zizmor: ignore[artipacked]
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: git-cliff

      - name: Bump versions
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          cd ain
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp && mv package.json.tmp package.json
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" src-tauri/Cargo.toml
          awk -v v="$VERSION" 'prev == "name = \"ain\"" && /^version = / { $0 = "version = \"" v "\"" } { print; prev = $0 }' \
            src-tauri/Cargo.lock > Cargo.lock.tmp && mv Cargo.lock.tmp src-tauri/Cargo.lock
          git diff --stat

      - name: Update CHANGELOG.md
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: git cliff --tag "$TAG" --output CHANGELOG.md

      # Pushed with the workflow token, so the release commit starts no new CI or Release run.
      # Atomic: if main moved meanwhile, neither the commit nor the tag lands.
      - name: Commit, tag and push
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md ain/package.json ain/src-tauri/Cargo.toml ain/src-tauri/Cargo.lock
          git commit -m "chore(release): $TAG"
          git tag -a "$TAG" -m "$TAG"
          git push --atomic origin HEAD:main "$TAG"

      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          git cliff --latest --strip all --output RELEASE_NOTES.md
          # The id comes from the creation itself: listing releases right after may not show the draft
          # yet, and without an id the builds upload nothing.
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f name="AiN $TAG" \
            -F draft=true -F body=@RELEASE_NOTES.md --jq .id)"
          [[ "$id" =~ ^[0-9]+$ ]] || { echo "::error::No id for the draft release of $TAG: '$id'"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: [plan, prepare]
    # Explicit, as for `publish`: a skipped `ci` (any automatic run) would otherwise skip every job after it.
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            # The AppImage runs on any distro, immutable ones (Fedora Silverblue) included.
            bundles: deb,rpm,appimage
            npm: linux-x64
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            npm: win32-x64
          - name: macOS x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            npm: darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: ./.github/scripts/linux-deps.sh
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ain/src-tauri -> target
          key: release
      # rust-cache keeps sherpa-onnx-sys's build output but prunes the native libraries it extracted
      # under target/, which it then never fetches again: make it start over.
      - name: Refetch sherpa-onnx's native libraries
        shell: bash
        working-directory: ain/src-tauri
        run: |
          rm -rf target/sherpa-onnx-prebuilt
          cargo clean --locked -p sherpa-onnx-sys --target ${{ matrix.target }}
      - name: Install frontend dependencies
        working-directory: ain
        run: bun install --frozen-lockfile
      # Self-update: with the signing key, each build also signs its installer and tauri-action adds
      # the platform to the release's `latest.json`, which installed apps read (see docs/updates.md).
      # Without it, releases still build, just without updates.
      - name: Enable updater artifacts
        shell: bash
        working-directory: ain/src-tauri
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [[ "$HAS_KEY" == true ]]; then
            jq '.bundle.createUpdaterArtifacts = true' tauri.conf.json > tauri.conf.json.tmp && mv tauri.conf.json.tmp tauri.conf.json
          else
            echo "::warning::No TAURI_SIGNING_PRIVATE_KEY secret: this release won't offer itself as an update."
          fi
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ain
          tauriScript: bun run tauri
          args: --target ${{ matrix.target }}${{ matrix.bundles && format(' --bundles {0}', matrix.bundles) || '' }}
          releaseId: ${{ needs.prepare.outputs.release_id }}
          # latest.json's plain `windows-x86_64` entry: the per-user NSIS installer (no admin
          # prompt), not the MSI. (The updater looks for `windows-x86_64-<nsis|msi>` first.)
          updaterJsonPreferNsis: true
      # The app itself for its npm package (see npm/build.ts), in a tarball: artifacts drop the
      # executable bit.
      - name: Stage the npm binary
        if: vars.NPM_PUBLISH == 'true'
        shell: bash
        working-directory: ain/src-tauri/target/${{ matrix.target }}/release
        env:
          PLATFORM: ${{ matrix.npm }}
        run: |
          rm -rf npm && mkdir npm
          case "$PLATFORM" in
            win32-*) cp ain.exe npm/ ;;
            darwin-*) cp -R bundle/macos/*.app npm/ ;;
            linux-*) cp bundle/appimage/*.AppImage npm/AiN.AppImage ;;
          esac
          tar -czf "npm-$PLATFORM.tgz" -C npm .
      - if: vars.NPM_PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-${{ matrix.npm }}
          path: ain/src-tauri/target/${{ matrix.target }}/release/npm-${{ matrix.npm }}.tgz
          if-no-files-found: error
          retention-days: 7

  # `@satcomx00/ain-fedora44`: the app built on Fedora 44 against its own libraries, for npm only
  # (see npm/README.md). npm can't tell distros apart, so users pick this package by name.
  fedora:
    name: Build (Fedora 44 x64, npm)
    needs: [plan, prepare]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && vars.NPM_PUBLISH == 'true' }}
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false
      - name: Install Fedora system dependencies
        run: ./.github/scripts/fedora-deps.sh
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      # The bare executable (the frontend is built into it), tarred as for the other platforms.
      - name: Build the app
        working-directory: ain
        run: |
          bun install --frozen-lockfile
          bun run tauri build --ci --no-bundle
          mkdir -p npm && cp src-tauri/target/release/ain npm/
          tar -czf npm-fedora44.tgz -C npm .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-fedora44
          path: ain/npm-fedora44.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: [plan, prepare, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false
      - name: Install cryptography
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet cryptography==49.0.0
      # Installed apps read `latest.json` the moment the release is public: check, while it is
      # still a draft, that it announces this version for every platform, that each entry points
      # at a file of the release, and that each signature verifies against the app's public key.
      - name: Check the update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [[ "$HAS_KEY" != true ]]; then
            echo "::warning::No TAURI_SIGNING_PRIVATE_KEY secret: $TAG has no update manifest to check."
            exit 0
          fi
          assets="$RUNNER_TEMP/assets"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$assets"
          [[ -f "$assets/latest.json" ]] || { echo "::error::$TAG has no latest.json: installed apps won't see it"; exit 1; }
          # Uploaded to a draft, entries point at asset ids: name them (the tags endpoint skips drafts).
          export ASSET_IDS="$RUNNER_TEMP/asset-ids.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --jq '[.assets[] | {key: (.id | tostring), value: .name}] | from_entries' > "$ASSET_IDS"
          "$RUNNER_TEMP/venv/bin/python" .github/scripts/check-update-manifest.py "$assets/latest.json" "$assets" \
            ain/src-tauri/tauri.conf.json "$VERSION" windows-x86_64 darwin-x86_64 linux-x86_64
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        # Never publish a release nobody can download: a build that "succeeds" without uploading
        # leaves it a draft.
        run: |
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
          [[ "$assets" -gt 0 ]] || { echo "::error::$TAG has no assets: left as a draft"; exit 1; }
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  # `bun i -g @satcomx00/ain`: one package per platform, and the main one, whose optional
  # dependencies make npm/bun fetch only the one for the machine (see npm/README.md). Off until the
  # `NPM_PUBLISH` variable is `true`. Publishes with npm's trusted publishing (OIDC, with
  # provenance), or with the `NPM_TOKEN` secret when set (needed for each package's first version).
  npm:
    name: Publish to npm
    needs: [plan, fedora, publish]
    if: >-
      !cancelled() && needs.publish.result == 'success' && needs.fedora.result == 'success' &&
      vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: npm-*
          path: ${{ runner.temp }}/downloads
      # Trusted publishing needs npm 11.5.1 or later. Pinned, as the action and tool versions above.
      - run: npm install --global npm@11.21.1 # zizmor: ignore[adhoc-packages]
      - name: Build the packages
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          binaries="$RUNNER_TEMP/binaries"
          for tarball in "$RUNNER_TEMP"/downloads/npm-*/npm-*.tgz; do
            platform="$(basename "$tarball" .tgz)"
            mkdir -p "$binaries/${platform#npm-}"
            tar -xzf "$tarball" -C "$binaries/${platform#npm-}"
          done
          bun build.ts "$VERSION" "$binaries" "$RUNNER_TEMP/packages" > "$RUNNER_TEMP/packages.txt"
      - name: Publish
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          [[ -z "$NODE_AUTH_TOKEN" ]] || echo "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
          # Platforms first, the main package last: it never points at a version that isn't out.
          while read -r dir; do
            name="$(jq -r .name "$dir/package.json")"
            # A rerun skips what the previous attempt published.
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already out"
              continue
            fi
            npm publish "$dir" --access public --provenance
          done < "$RUNNER_TEMP/packages.txt"
