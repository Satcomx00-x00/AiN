name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BUN_VERSION: "1.3.14"
  LLVM_COV_VERSION: "0.9.1"

defaults:
  run:
    shell: bash
    working-directory: ain

jobs:
  commitlint:
    name: Commit messages
    # Inside workflow_call the event is the caller's (e.g. workflow_dispatch): nothing to lint then.
    # Dependabot writes its own titles (prefixes set in dependabot.yml) and they can outgrow the
    # header limit, which it offers no way to shorten.
    if: (github.event_name == 'push' || github.event_name == 'pull_request') && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Lint pull request commits
        if: github.event_name == 'pull_request'
        run: bunx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
      - name: Lint pull request title (used as the squash-merge message)
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | bunx commitlint --verbose
      - name: Lint pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            bunx commitlint --from "$BEFORE" --to "$AFTER" --verbose
          else
            bunx commitlint --last --verbose
          fi

  hooks:
    name: Hooks (prek)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The commit-stage hooks (prek.toml) on every file: hygiene, spelling, secrets, workflows,
      # shell scripts. Their TypeScript and Rust hooks are left to the jobs below, which set up
      # those toolchains anyway.
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          prek-version: "0.5.5"
          extra-args: --all-files --no-group frontend --no-group rust

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Unit and integration tests, failing below 100% coverage (thresholds in vitest.config.ts).
      - run: bun run test:coverage
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-coverage
          path: ain/coverage
          if-no-files-found: ignore
          retention-days: 7
      - run: bun run build

  browser:
    name: Browser tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
          - name: Windows 11 x64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # Chromium is the engine of Windows' WebView2; WebKit, of Linux's WebKitGTK.
      - run: bunx playwright install --with-deps chromium webkit
      # End to end: the island and its windows in both engines, on the dev server and the preview's fake backend.
      - run: bun run test:e2e
      # Smoke: the production build, each window opened with a stand-in for the Tauri backend.
      - run: bun run test:smoke
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            ain/playwright-report
            ain/test-results
          retention-days: 7

  # The update flow itself (check, download, signature) runs in the Rust tests below, on every OS
  # (src-tauri/tests/update_flow.rs). This checks the checker Release runs on `latest.json`.
  update-manifest:
    name: Update manifest check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cryptography
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet cryptography==49.0.0
      - run: PYTHON="$RUNNER_TEMP/venv/bin/python" ./.github/scripts/test-check-update-manifest.sh

  # The npm packages Release publishes (npm/): built from stand-in binaries, installed from their
  # tarballs as a registry install would, and launched.
  npm:
    name: npm packages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Installs the tarballs just built, not packages from the registry.
      - name: Build, install and launch
        run: | # zizmor: ignore[adhoc-packages]
          bin="$RUNNER_TEMP/bin" out="$RUNNER_TEMP/out" ran="$RUNNER_TEMP/ran"
          mkdir -p "$bin/linux-x64" "$bin/fedora43" "$bin/fedora44" "$bin/win32-x64"
          # Stand-ins that write their name and arguments where the checks below look.
          for app in linux-x64/AiN.AppImage fedora43/ain fedora44/ain; do
            printf '#!/bin/sh\necho %s "$@" > %s\n' "${app%%/*}" "$ran" > "$bin/$app"
            chmod +x "$bin/$app"
          done
          touch "$bin/win32-x64/ain.exe"
          bun build.ts 1.2.3 "$bin" "$out"
          # The Fedora packages are only ever installed by name.
          jq -e '.optionalDependencies | keys == ["@satcomx00/ain-linux-x64", "@satcomx00/ain-win32-x64"]' \
            "$out/ain/package.json"
          (cd "$out" && npm pack ./ain-linux-x64 ./ain-fedora44 ./ain)

          ran_with() { # <expected output>: what the stand-in app last ran with
            for _ in $(seq 20); do [[ -s "$ran" ]] && break; sleep 0.5; done
            grep -qx -- "$1" "$ran" || { echo "expected '$1', got '$(cat "$ran")'"; exit 1; }
            rm -f "$ran"
          }
          npm_install() { # <prefix> <tarballs…>
            local prefix="$1"; shift
            npm install --global --prefix "$prefix" "$@"
          }

          npm_install "$RUNNER_TEMP/main" "$out"/satcomx00-ain-{linux-x64-,}1.2.3.tgz
          "$RUNNER_TEMP/main/bin/ain" --from-npm
          ran_with "linux-x64 --from-npm"

          npm_install "$RUNNER_TEMP/fedora" "$out"/satcomx00-ain-fedora44-1.2.3.tgz
          "$RUNNER_TEMP/fedora/bin/ain" --from-npm
          ran_with "fedora44 --from-npm"

          # Uninstalling cleans up through the app, then removes the package.
          "$RUNNER_TEMP/fedora/bin/ain" uninstall --purge
          ran_with "fedora44 --cleanup --purge"
          [[ ! -e "$RUNNER_TEMP/fedora/lib/node_modules/@satcomx00/ain-fedora44" ]]

          # Next to a copy from an installer, it refuses to start.
          sudo touch /usr/bin/ain
          if "$RUNNER_TEMP/main/bin/ain" 2> "$RUNNER_TEMP/err"; then echo "started next to /usr/bin/ain"; exit 1; fi
          grep -q "already installed at /usr/bin/ain" "$RUNNER_TEMP/err"
          sudo rm /usr/bin/ain

  rust-fmt:
    name: Rust format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

  rust:
    name: Rust (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            # Line coverage floors, about 2 points under what each OS measures: a drop fails the job.
            min_lines: 52
          # GitHub has no hosted Windows 11 x64 runner: Server 2025 is built from the same release
          # (24H2, build 26100), the same kernel, Win32, WinRT, Core Audio and WebView2.
          - name: Windows 11 x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            min_lines: 48
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        working-directory: .
        run: ./.github/scripts/linux-deps.sh
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ain/src-tauri -> target
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --version "$LLVM_COV_VERSION"
      # Over GitHub's file limit, Windows' archive isn't in the repository: put it where the build reads it.
      - name: Fetch sherpa-onnx's Windows libraries
        if: runner.os == 'Windows'
        shell: bash
        working-directory: .
        run: ./.github/scripts/sherpa-onnx-windows.sh
      # rust-cache keeps sherpa-onnx-sys's build output but prunes the native libraries it extracted
      # under target/, which it then never extracts again: make it start over, from the archive in
      # src-tauri/vendor/sherpa-onnx.
      - name: Re-extract sherpa-onnx's native libraries
        shell: bash
        working-directory: ain/src-tauri
        run: |
          rm -rf target/sherpa-onnx-prebuilt
          cargo clean --locked -p sherpa-onnx-sys --target ${{ matrix.target }}
      # tauri::generate_context! embeds ../dist, so the frontend must exist before compiling.
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Clippy
        working-directory: ain/src-tauri
        run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      # The tests, this OS's backends included, measured: lines and functions each OS runs.
      - name: Tests, with coverage
        working-directory: ain/src-tauri
        run: |
          cargo llvm-cov --locked --target ${{ matrix.target }} --no-report
          cargo llvm-cov report --target ${{ matrix.target }} --lcov --output-path lcov.info
          cargo llvm-cov report --target ${{ matrix.target }} --summary-only | tee coverage-summary.txt
          {
            echo "### Rust coverage, ${{ matrix.name }}"
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --target ${{ matrix.target }} --summary-only --fail-under-lines ${{ matrix.min_lines }} > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-coverage-${{ matrix.target }}
          path: ain/src-tauri/lcov.info
          retention-days: 7

  # Fedora 43 and 44 in containers: their own libraries (GTK, WebKitGTK, PipeWire) and toolchain, the
  # tests against them, then the .rpm installed with dnf and the installed app launched.
  fedora:
    name: Fedora ${{ matrix.release }} x64
    strategy:
      fail-fast: false
      matrix:
        # The releases the npm packages `@satcomx00/ain-fedora<release>` are built for (release.yml).
        release: [43, 44]
    runs-on: ubuntu-24.04
    container: fedora:${{ matrix.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Fedora system dependencies
        working-directory: .
        run: ./.github/scripts/fedora-deps.sh
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ain/src-tauri -> target
          key: fedora-${{ matrix.release }}
      # rust-cache keeps sherpa-onnx-sys's build output but prunes the native libraries it extracted
      # under target/, which it then never extracts again: make it start over, from the archive in
      # src-tauri/vendor/sherpa-onnx.
      - name: Re-extract sherpa-onnx's native libraries
        working-directory: ain/src-tauri
        run: |
          rm -rf target/sherpa-onnx-prebuilt
          cargo clean --locked -p sherpa-onnx-sys
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      - name: Tests
        working-directory: ain/src-tauri
        run: cargo test --locked
      - run: bun run tauri build --ci --bundles rpm
      - name: Install the .rpm
        run: |
          rpms=(src-tauri/target/release/bundle/rpm/*.rpm)
          rpm=${rpms[0]}
          dnf install -y "$rpm"
          rpm -qlp "$rpm" | grep -m 1 '^/usr/bin/' > installed-binary
          echo "Installed $(rpm -qp "$rpm") as $(cat installed-binary)"
      - name: Launch the installed app
        # WebKitGTK sandboxes its web processes with bubblewrap, which can't make namespaces inside
        # an unprivileged container; on a desktop the sandbox stays on.
        env:
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
        run: ../.github/scripts/launch-check.sh "$(cat installed-binary)" launch-check
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: launch-check-fedora-${{ matrix.release }}
          path: ain/launch-check
          if-no-files-found: ignore
          retention-days: 7

  # The packaged app on Windows, as users get it: installed and launched.
  # Linux's counterparts are the AppImage job below and Fedora's .rpm above.
  launch:
    name: Install and launch (${{ matrix.name }})
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows 11 x64
            os: windows-2025
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ain/src-tauri -> target
          key: launch
      # Over GitHub's file limit, Windows' archive isn't in the repository: put it where the build reads it.
      - name: Fetch sherpa-onnx's Windows libraries
        if: runner.os == 'Windows'
        shell: bash
        working-directory: .
        run: ./.github/scripts/sherpa-onnx-windows.sh
      # rust-cache keeps sherpa-onnx-sys's build output but prunes the native libraries it extracted
      # under target/, which it then never extracts again: make it start over, from the archive in
      # src-tauri/vendor/sherpa-onnx.
      - name: Re-extract sherpa-onnx's native libraries
        working-directory: ain/src-tauri
        run: |
          rm -rf target/sherpa-onnx-prebuilt
          cargo clean --locked -p sherpa-onnx-sys
      - run: bun install --frozen-lockfile
      - run: bun run tauri build --ci --bundles ${{ matrix.bundles }}
      # The per-user NSIS installer, silent, as an update would run it; then the installed app.
      - name: Install, launch and uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'AiN'
          $exe = Get-ChildItem $dir -Filter *.exe | Where-Object Name -notmatch 'uninstall' | Select-Object -First 1
          if (-not $exe) { Write-Output "::error::nothing installed in $dir"; exit 1 }
          ../.github/scripts/launch-check.ps1 -App $exe.FullName -Out launch-check
          Start-Process (Join-Path $dir 'uninstall.exe') -ArgumentList '/S' -Wait
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: launch-check-${{ matrix.os }}
          path: ain/launch-check
          if-no-files-found: ignore
          retention-days: 7

  appimage:
    name: AppImage (Linux x64)
    # Releases build this too, so only check it here, not again when Release calls this workflow.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux system dependencies
        working-directory: .
        run: ./.github/scripts/linux-deps.sh
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ain/src-tauri -> target
          key: appimage
      # rust-cache keeps sherpa-onnx-sys's build output but prunes the native libraries it extracted
      # under target/, which it then never extracts again: make it start over, from the archive in
      # src-tauri/vendor/sherpa-onnx.
      - name: Re-extract sherpa-onnx's native libraries
        shell: bash
        working-directory: ain/src-tauri
        run: |
          rm -rf target/sherpa-onnx-prebuilt
          cargo clean --locked -p sherpa-onnx-sys
      - run: bun install --frozen-lockfile
      - run: bun run tauri build --ci --bundles appimage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: appimage
          path: ain/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7
      # Starts the AppImage on a virtual display: it must come up, lay out its window and keep running.
      - name: Launch the app
        run: |
          sudo apt-get install -y --no-install-recommends xvfb x11-utils dbus-x11 imagemagick
          ../.github/scripts/launch-check.sh "$(ls src-tauri/target/release/bundle/appimage/*.AppImage)" launch-check
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: launch-check
          path: ain/launch-check
          if-no-files-found: ignore
          retention-days: 7
