name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BUN_VERSION: "1.3.14"

defaults:
  run:
    shell: bash
    working-directory: widget-island

jobs:
  commitlint:
    name: Commit messages
    # Inside workflow_call the event is the caller's (e.g. workflow_dispatch): nothing to lint then.
    # Dependabot writes its own titles (prefixes set in dependabot.yml) and they can outgrow the
    # header limit, which it offers no way to shorten.
    if: (github.event_name == 'push' || github.event_name == 'pull_request') && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Lint pull request commits
        if: github.event_name == 'pull_request'
        run: bunx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
      - name: Lint pull request title (used as the squash-merge message)
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | bunx commitlint --verbose
      - name: Lint pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            bunx commitlint --from "$BEFORE" --to "$AFTER" --verbose
          else
            bunx commitlint --last --verbose
          fi

  hooks:
    name: Hooks (prek)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # The commit-stage hooks (prek.toml) on every file: hygiene, spelling, secrets, workflows,
      # shell scripts. Their TypeScript and Rust hooks are left to the jobs below, which set up
      # those toolchains anyway.
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          prek-version: "0.5.5"
          extra-args: --all-files --no-group frontend --no-group rust

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # Chromium is the engine of Windows' WebView2; WebKit, of macOS' WKWebView and Linux's WebKitGTK.
      - run: bunx playwright install --with-deps chromium webkit
      # End to end: the island and its windows in both engines, on the dev server and the preview's fake backend.
      - run: bun run test:e2e
      # Smoke: the production build, each window opened with a stand-in for the Tauri backend.
      - run: bun run test:smoke
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: |
            widget-island/playwright-report
            widget-island/test-results
          retention-days: 7

  rust-fmt:
    name: Rust format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

  rust:
    name: Rust (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS x64
            os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        working-directory: .
        run: ./.github/scripts/linux-deps.sh
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: widget-island/src-tauri -> target
      # rust-cache keeps sherpa-onnx-sys's build output but prunes the native libraries it extracted
      # under target/, which it then never fetches again: make it start over.
      - name: Refetch sherpa-onnx's native libraries
        shell: bash
        working-directory: widget-island/src-tauri
        run: |
          rm -rf target/sherpa-onnx-prebuilt
          cargo clean --locked -p sherpa-onnx-sys --target ${{ matrix.target }}
      # tauri::generate_context! embeds ../dist, so the frontend must exist before compiling.
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Clippy
        working-directory: widget-island/src-tauri
        run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Tests
        working-directory: widget-island/src-tauri
        run: cargo test --locked --target ${{ matrix.target }}

  appimage:
    name: AppImage (Linux x64)
    # Releases build this too, so only check it here, not again when Release calls this workflow.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install Linux system dependencies
        working-directory: .
        run: ./.github/scripts/linux-deps.sh
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: widget-island/src-tauri -> target
          key: appimage
      # rust-cache keeps sherpa-onnx-sys's build output but prunes the native libraries it extracted
      # under target/, which it then never fetches again: make it start over.
      - name: Refetch sherpa-onnx's native libraries
        shell: bash
        working-directory: widget-island/src-tauri
        run: |
          rm -rf target/sherpa-onnx-prebuilt
          cargo clean --locked -p sherpa-onnx-sys
      - run: bun install --frozen-lockfile
      - run: bun run tauri build --ci --bundles appimage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: appimage
          path: widget-island/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7
      # Starts the AppImage on a virtual display: it must come up, lay out its window and keep running.
      - name: Launch the app
        run: |
          sudo apt-get install -y --no-install-recommends xvfb x11-utils dbus-x11 imagemagick
          ../.github/scripts/launch-check.sh "$(ls src-tauri/target/release/bundle/appimage/*.AppImage)" launch-check
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: launch-check
          path: widget-island/launch-check
          if-no-files-found: ignore
          retention-days: 7
