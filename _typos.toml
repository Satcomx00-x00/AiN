# Spell checking (https://github.com/crate-ci/typos), run by prek.

[files]
extend-exclude = [
  # Generated: fixed by regenerating, not by hand.
  "**/bindings.ts",
  "**/bindings/*.ts",
  "ain/src-tauri/gen/",
  "CHANGELOG.md",
  # Lockfiles hold hashes and package names.
  "*.lock",
  "bun.lock",
  # Spelling's own code and tests are full of misspellings on purpose: what it corrects.
  "ain/src-tauri/src/features/spelling/",
  "ain/src/features/spelling/",
]

[default.extend-words]
# JetBrains' "Darcula" theme, not a misspelt Dracula.
darcula = "darcula"
# Core Audio's four-letter property codes ('inpt' is the input scope).
inpt = "inpt"
