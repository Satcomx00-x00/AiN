# git-cliff configuration — https://git-cliff.org/docs/configuration
# Generates CHANGELOG.md and release notes from Conventional Commits.

# No [remote.github]: git-cliff would then query the GitHub API for every commit, which the template
# does not use and anonymous CI runners get rate-limited on (HTTP 403). The URL is written out instead.

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.
The format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/) and the project uses [Semantic Versioning](https://semver.org/).

"""
body = """
{%- macro remote_url() -%}
  https://github.com/Satcomx00-x00/AiN
{%- endmacro -%}

{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}]\
  {%- if previous.version %}({{ self::remote_url() }}/compare/{{ previous.version }}..{{ version }}){% else %}({{ self::remote_url() }}/releases/tag/{{ version }}){% endif %} \
  - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else -%}
## [Unreleased]
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
  {% if commit.breaking %}[**breaking**] {% endif %}\
  {{ commit.message | upper_first }} \
  ([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true
render_always = false

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "oldest"
commit_preprocessors = [
  # Turn "(#123)" into a link to the pull request.
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/Satcomx00-x00/AiN/pull/${1}))" },
]
# The HTML comments only control group ordering; `striptags` removes them when rendering.
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^doc", group = "<!-- 4 -->Documentation" },
  { message = "^style", group = "<!-- 5 -->Style" },
  { message = "^test", group = "<!-- 6 -->Tests" },
  { message = "^build", group = "<!-- 7 -->Build" },
  { message = "^ci", group = "<!-- 8 -->CI" },
  { message = "^revert", group = "<!-- 9 -->Reverts" },
  { message = "^chore", group = "<!-- 10 -->Miscellaneous" },
]

[bump]
# Pre-1.0: a feature bumps the minor, a breaking change also only bumps the minor.
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
