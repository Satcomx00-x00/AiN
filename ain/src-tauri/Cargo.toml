[package]
name = "ain"
version = "0.10.0"
edition = "2024"

[lib]
name = "ain_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "specta"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "network"] }
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }
tauri-plugin-autostart = "2"
# Removes the launch-at-login entry the app had under its old name (see shell/renamed.rs).
auto-launch = "0.6"
# Where the old name's folders are, before the app starts (see shell/renamed.rs).
dirs = "7"
serde_json = "1.0.154"
# The community plugin store (store.yaml on the repository's `store` branch).
serde_yaml_ng = "0.10"
# Plugins' secrets (API keys, tokens), in the system's credential store rather than settings.json.
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
xcap = "0.9.8"
cpal = "0.18.2"
ureq = "3.4.2"
base64 = "0.23"
# Speech recognition for dictation and speech synthesis for read aloud, from prebuilt static
# libraries (Windows, Linux and macOS x64).
sherpa-onnx = "1.13.8"
sha2 = "0.11.1"
# Read aloud's voices come as .tar.bz2 archives (bzip2 in pure Rust: no C toolchain needed).
tar = "0.4.46"
bzip2 = { version = "0.5.2", default-features = false, features = ["libbz2-rs-sys"] }
tauri-plugin-dialog = "2"
# Typed TypeScript bindings for commands and events; pinned exactly while specta 2 is a release candidate.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
# PKCE verifiers and sign-in states for plugins signing in to online accounts.
getrandom = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSScreen", "NSResponder", "NSRunningApplication", "NSWorkspace", "NSPasteboard", "libc"] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["image-data", "wayland-data-control"] }
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
# So helper processes (pactl) end with the app, however it ends.
libc = "0.2"
# Now playing, from MPRIS players over D-Bus.
mpris = "2.1"
# Zones: the pointer and other apps' windows, through the X server…
x11rb = "0.13"
# …or, on GNOME's Wayland, through AiN's GNOME Shell extension; and global shortcuts through the
# desktop portal (the same D-Bus library as mpris).
dbus = "0.9"

[target."cfg(windows)".dependencies]
clipboard-win = "5.4.1"
winreg = "0.56"
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Win32_Foundation",
    "Media_Control",
    "Storage_Streams",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Graphics_Dwm",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Power",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"

[dev-dependencies]
# The mock runtime, to run the updater plugin in tests (tests/update_flow.rs).
tauri = { version = "2", features = ["test"] }
